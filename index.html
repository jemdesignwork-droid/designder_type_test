<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>당신은 어떤 디자이너인가요? · 디자이너 유형 테스트</title>
  <meta name="description" content="다섯 가지 질문에 답하고 나의 디자이너 유형을 확인해보세요." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <!-- 1. 시작 화면 -->
    <section id="screen-start" class="screen active" aria-label="시작 화면">
      <div class="card start-card">
        <p class="eyebrow">DESIGNER TYPE TEST</p>
        <h1>당신은 어떤<br />디자이너인가요?</h1>
        <p class="subtext">다섯 가지 질문에 답하고<br />나의 디자이너 유형을 확인해보세요.</p>
        <p class="meta">
          <svg class="icon-clock" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          약 1분 소요
        </p>
        <button id="btn-start" class="btn btn-primary" type="button">시작하기</button>
      </div>
    </section>

    <!-- 2. 질문 화면 -->
    <section id="screen-question" class="screen" aria-label="질문 화면">
      <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" id="progress">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-label" id="progress-label">1 / 5</span>
      </div>

      <div class="card question-card" id="question-card">
        <h2 id="question-text"></h2>
        <div class="options" id="options"></div>
      </div>

      <button id="btn-back" class="btn btn-text" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        이전으로
      </button>
    </section>

    <!-- 3. 결과 화면 -->
    <section id="screen-result" class="screen" aria-label="결과 화면">
      <div class="card result-card">
        <div class="result-image" id="result-image">
          <img id="result-image-img" src="" alt="" />
        </div>
        <p class="result-tagline" id="result-tagline"></p>
        <h2 id="result-name"></h2>
        <p id="result-desc"></p>
        <div class="result-actions">
          <button id="btn-restart" class="btn btn-primary" type="button">다시하기</button>
          <button id="btn-share" class="btn btn-outline" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="18" cy="5" r="2.4" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="6" cy="12" r="2.4" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="18" cy="19" r="2.4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8.1 10.8l7.8-4.6M8.1 13.2l7.8 4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            공유하기
          </button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
